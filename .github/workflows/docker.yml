name: Build, publish & deploy Docker image

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: japan-trip-planner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase Configuration
        env:
          FIREBASE_CONFIG_SECRET: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG_SECRET" ]; then
            echo "$FIREBASE_CONFIG_SECRET" > src/JapanTripPlanner.App/firebase-config.js
            echo "Successfully injected FIREBASE_CONFIG secret into firebase-config.js"
          else
            echo "Warning: FIREBASE_CONFIG secret is not set!"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$owner" ]; then
            echo "Failed to derive the container image owner."
            exit 1
          fi

          echo "value=$owner" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Install WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard

      - name: Configure WireGuard
        run: |
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Connect WireGuard VPN
        run: sudo wg-quick up wg0

      - name: Wait for VPN stability
        run: sleep 5

      - name: Verify Portainer reachable
        run: |
          curl --fail --silent --show-error \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
            "${{ secrets.PORTAINER_URL }}/api/system/status"

      - name: Update image tag and redeploy stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          current_env="$(
            curl --fail --silent \
              -H "X-API-Key: $PORTAINER_API_KEY" \
              "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID" \
              | jq '.Env // []'
          )"

          updated_env="$(
            echo "$current_env" | jq --arg tag "$IMAGE_TAG" '
              map(if .name == "IMAGE_TAG" then .value = $tag else . end)
              | if any(.[]; .name == "IMAGE_TAG")
                then .
                else . + [{"name":"IMAGE_TAG","value":$tag}]
                end
            '
          )"

          payload="$(
            jq -n --argjson env "$updated_env" \
              '{"env": $env, "pullImage": true}'
          )"

          curl --fail --silent --show-error \
            --max-time 900 \
            -X PUT \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$PORTAINER_ENDPOINT_ID"

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0
